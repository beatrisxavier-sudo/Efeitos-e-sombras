<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Postagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Meu Feed</h1>
    <button id="toggle-theme">Alternar Modo</button>
  </header>

  <main class="posts-container">
    <article class="card">
      <h2>Título da Postagem 1</h2>
      <p>Este é o conteúdo do primeiro card. Passe o mouse sobre ele para ver a animação e o efeito de profundidade.</p>
    </article>

    <article class="card">
      <h2>Título da Postagem 2</h2>
      <p>Outro exemplo de card com transição suave, alteração de escala e sombra personalizada.</p>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
